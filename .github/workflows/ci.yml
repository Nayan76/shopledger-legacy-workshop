name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and tests without application data
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config.js
            /package.json
            /lib/
            /test/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Run tests and report coverage without the datastore
        shell: bash
        run: |
          test ! -e data/db.json
          coverage_log="$RUNNER_TEMP/shopledger-test-coverage.tap"
          test_status=0
          node --test --experimental-test-coverage --test-reporter=tap \
            --test-coverage-include='config.js' --test-coverage-include='lib/**/*.js' \
            | tee "$coverage_log" || test_status=$?

          {
            echo '### Node.js test coverage'
            echo
            echo '```text'
            sed -n '/^# start of coverage report$/,/^# end of coverage report$/p' "$coverage_log" | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"
