name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and tests without application data
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config.js
            /package.json
            /lib/
            /test/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Run tests without the datastore
        run: |
          test ! -e data/db.json
          node --test
