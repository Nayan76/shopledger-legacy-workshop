<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc"><title id="title">ShopLedger application architecture</title><desc id="desc">The browser communicates with Express and its four routers. The module map lists direct application dependencies. The highlighted workflow traces order placement, JSON persistence, and the subsequent printable invoice request.</desc><defs><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#087b74"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#16263c}.title{font-size:42px;font-weight:700}.sub{font-size:18px;fill:#45576e}.section{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#40546d}.name{font-size:20px;font-weight:700}.body{font-size:16px;fill:#34465e}.dep{font-size:15px;fill:#52647c}.step{font-size:18px;font-weight:700;fill:#075e57}.small{font-size:15px;fill:#34465e}</style>
<path fill="#f4f7fb" d="M0 0H1600V1390H0Z"/>
<text x="40" y="65" class="title">ShopLedger application architecture</text>
<text x="42" y="96" class="sub">Point of sale, inventory, Khata ledger, and printable GST invoices</text>
<text x="42" y="139" class="section">FRONTEND</text>
<rect x="40" y="152" width="1520" height="82" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="58" y="181" class="name">Browser UI</text>
<text x="58" y="214" class="body">public/index.html  ·  public/css/style.css</text>
<text x="660" y="214" class="body">public/js/app.js  ·  XMLHttpRequest and DOM updates</text>
<text x="42" y="271" class="section">BACKEND</text>
<path d="M800 240V278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)" marker-start="url(#gray)"/>
<rect x="40" y="284" width="1520" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="58" y="313" class="name">server.js  ·  Express</text>
<text x="58" y="339" class="body">Serves public/  ·  parses JSON  ·  mounts all four routers under /api</text>
<text x="58" y="364" class="dep">GET /orders/:id/invoice  →  store.read() → orders.get() → invoice.render()   ·   Port → config</text>
<g transform="translate(0 132)">
<path d="M800 252V270H224 M800 270H1376" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M224 270V284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M608 270V284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M992 270V284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M1376 270V284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<rect x="40" y="284" width="368" height="126" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="54" y="311" class="name">routes/products.js</text>
<text x="54" y="336" class="small">GET /products · /coupons</text>
<text x="54" y="386" class="dep">→ store, inventory, tax, coupons</text>
<rect x="424" y="284" width="368" height="126" rx="12" fill="#e7f7f4" stroke="#68b6ac"/>
<text x="438" y="311" class="name">routes/orders.js</text>
<text x="438" y="336" class="small">GET /orders · /orders/:id</text>
<text x="438" y="358" class="small">POST /orders · /orders/:id/cancel</text>
<text x="438" y="381" class="dep">→ store, inventory, pricing, coupons,</text>
<text x="438" y="399" class="dep">   orders, ledger</text>
<rect x="808" y="284" width="368" height="126" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="822" y="311" class="name">routes/customers.js</text>
<text x="822" y="336" class="small">GET /customers</text>
<text x="822" y="358" class="small">POST /customers/:id/settle</text>
<text x="822" y="386" class="dep">→ store, ledger</text>
<rect x="1192" y="284" width="368" height="126" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1206" y="311" class="name">routes/reports.js</text>
<text x="1206" y="336" class="small">GET /reports/dashboard</text>
<text x="1206" y="358" class="small">GET /reports/gst-reconciliation · /admin/export</text>
<text x="1206" y="379" class="small">POST /pricing/preview</text>
<text x="1206" y="399" class="dep">→ config, store, reports, pricing, coupons</text>
<text x="42" y="444" class="section">BUSINESS LOGIC  /  lib/</text>
<text x="561" y="444" class="dep">→  Direct dependency (names match module filenames)</text>
<rect x="40" y="458" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="53" y="484" class="name">pricing.js</text>
<text x="53" y="507" class="small">Subtotal, discount allocation, GST</text>
<text x="53" y="528" class="dep">→ coupons, tax</text>
<rect x="347" y="458" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="360" y="484" class="name">coupons.js</text>
<text x="360" y="507" class="small">Code validation and discount rules</text>
<text x="360" y="528" class="dep">→ config</text>
<rect x="654" y="458" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="667" y="484" class="name">tax.js</text>
<text x="667" y="507" class="small">Exact HSN lookup, GST split</text>
<text x="667" y="528" class="dep">→ config</text>
<rect x="961" y="458" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="974" y="484" class="name">inventory.js</text>
<text x="974" y="507" class="small">Stock checks and adjustments</text>
<text x="974" y="528" class="dep">→ config</text>
<rect x="1268" y="458" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1281" y="484" class="name">orders.js</text>
<text x="1281" y="507" class="small">Create, retrieve, list, cancel</text>
<text x="1281" y="528" class="dep">→ dates, inventory, ledger</text>
<rect x="40" y="554" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="53" y="580" class="name">ledger.js</text>
<text x="53" y="603" class="small">Khata charges and settlements</text>
<text x="53" y="624" class="dep">→ dates</text>
<rect x="347" y="554" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="360" y="580" class="name">invoice.js</text>
<text x="360" y="603" class="small">Recomputes figures, renders HTML</text>
<text x="360" y="624" class="dep">→ config</text>
<rect x="654" y="554" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="667" y="580" class="name">reports.js</text>
<text x="667" y="603" class="small">Dashboard and GST reconciliation</text>
<text x="667" y="624" class="dep">→ inventory, ledger, invoice</text>
<rect x="961" y="554" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="974" y="580" class="name">dates.js</text>
<text x="974" y="603" class="small">Order dates and date filters</text>
<rect x="1268" y="554" width="292" height="84" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1281" y="580" class="name">store.js</text>
<text x="1281" y="603" class="small">JSON reads, writes, and audit entries</text>
</g>
<text x="42" y="803" class="section">DATA STORAGE</text>
<rect x="40" y="817" width="1520" height="74" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="55" y="846" class="name">data/db.json</text>
<text x="55" y="871" class="small">Products, orders, customers, settlements, audit, ID counters</text>
<g transform="translate(0 132)">
<path d="M1414 638V685" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)" marker-start="url(#gray)"/>
<text x="1272" y="662" class="dep">fs read / write</text>
</g>
<text x="42" y="909" class="section">CONFIGURATION</text>
<rect x="40" y="923" width="1520" height="74" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="55" y="952" class="name">config.js</text>
<text x="55" y="977" class="body">Shop details, port, GST slabs, coupons, inventory defaults, export key</text>
<g transform="translate(0 220)">
<text x="42" y="805" class="section">ORDER PLACEMENT AND INVOICING</text>
<text x="860" y="805" class="dep">Teal arrows show the sequence. Numbered steps name the calls in order.</text>
<rect x="40" y="822" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="56" y="854" class="step">1   Preview and submit</text>
<text x="56" y="882" class="body">Browser → POST /api/pricing/preview</text>
<text x="56" y="904" class="body">Optional preview via routes/reports.js</text>
<text x="56" y="926" class="body">Browser → POST /api/orders</text>
<rect x="558" y="822" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="574" y="854" class="step">2   Read and check stock</text>
<text x="574" y="882" class="body">routes/orders.js → store.read()</text>
<text x="574" y="904" class="body">inventory.find() resolves catalog data</text>
<text x="574" y="926" class="body">inventory.check() checks sellable units</text>
<rect x="1076" y="822" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="1092" y="854" class="step">3   Validate and price</text>
<text x="1092" y="882" class="body">pricing.subtotal() → coupons.validate()</text>
<text x="1092" y="904" class="body">pricing.computeTotals() → coupon discount</text>
<text x="1092" y="926" class="body">and tax.getRateForItem() for line GST</text>
<rect x="1076" y="986" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="1092" y="1018" class="step">4   Apply credit and stock</text>
<text x="1092" y="1046" class="body">ledger.chargeOrderToKhata() for Khata</text>
<text x="1092" y="1068" class="body">inventory.reserve() deducts physical stock</text>
<rect x="558" y="986" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="574" y="1018" class="step">5   Record and persist</text>
<text x="574" y="1046" class="body">orders.add() → store.appendAudit()</text>
<text x="574" y="1068" class="body">store.write() → data/db.json</text>
<text x="574" y="1090" class="body">HTTP 201 returns the saved order</text>
<rect x="40" y="986" width="484" height="132" rx="12" fill="#edfaf7" stroke="#79bdb3"/>
<text x="56" y="1018" class="step">6   Open printable invoice</text>
<text x="56" y="1046" class="body">Browser → GET /orders/:id/invoice</text>
<text x="56" y="1068" class="body">server.js → store.read() → orders.get()</text>
<text x="56" y="1090" class="body">invoice.render() → computeInvoiceFigures()</text>
<path d="M528 886H553" fill="none" stroke="#087b74" stroke-width="2" marker-end="url(#teal)"/>
<path d="M1046 886H1071" fill="none" stroke="#087b74" stroke-width="2" marker-end="url(#teal)"/>
<path d="M1318 958V981" fill="none" stroke="#087b74" stroke-width="2" marker-end="url(#teal)"/>
<path d="M1072 1050H1047" fill="none" stroke="#087b74" stroke-width="2" marker-end="url(#teal)"/>
<path d="M554 1050H529" fill="none" stroke="#087b74" stroke-width="2" marker-end="url(#teal)"/>
<text x="42" y="1148" class="sub">The invoice recalculates GST and discount using its own rules, so its total can differ from the saved order.</text>
</g>
</svg>